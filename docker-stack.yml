version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: techstore
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    networks:
      - techstore-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d techstore"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  microservicio:
    image: techstore-api:swarm
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/techstore
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin123
    networks:
      - techstore-net
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
        max_attempts: 5
        delay: 8s
        window: 30s
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

networks:
  techstore-net:
    driver: overlay